<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14110f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KEREM Admin" />
  <title>KEREM Spa · Admin</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" href="/static/icons/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.svg" />
  <link rel="stylesheet" href="/static/styles.css?v=20261125a" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="side-brand">
        <div class="brand-icon" style="width:38px;height:38px;border-radius:12px;font-size:1rem;">K</div>
        <div>
          <p class="brand-title" style="font-size:.95rem;">KEREM</p>
          <p class="brand-sub">Administración</p>
        </div>
      </div>
      <button data-tab="citas" class="side-link nav-btn active">Citas</button>
      <button data-tab="pacientes" class="side-link nav-btn">Pacientes</button>
      <button data-tab="servicios" class="side-link nav-btn">Servicios</button>
      <div class="side-spacer"></div>
      <div id="appVersion" class="small muted" style="padding:8px 12px;">v20261125a</div>
      <button id="adminNotifBtn" class="side-link" style="position:relative;">
        Notificaciones
        <span id="adminNotifBadge" class="notif-badge hidden" style="top:8px;right:10px;">0</span>
      </button>
      <button id="adminLogout" class="side-link" style="color:#ffb4b4;">Cerrar sesión</button>
    </aside>

    <div class="admin-main">
      <header class="topbar admin-topbar">
        <div class="brand-mark">
          <div class="brand-icon">K</div>
          <div>
            <p class="brand-title">KEREM Admin</p>
            <p id="adminUserLabel" class="brand-sub">Panel de control</p>
          </div>
        </div>
        <div class="flex gap-2 items-center">
          <div class="notif-wrap">
            <button id="adminNotifBtnM" class="icon-btn" type="button" aria-label="Notificaciones">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
              <span id="adminNotifBadgeM" class="notif-badge hidden">0</span>
            </button>
            <div id="adminNotifPanel" class="notif-panel hidden">
              <div class="notif-head">
                <span>Notificaciones</span>
                <button id="adminNotifReadAll" class="small" style="color:var(--brand);">Marcar leídas</button>
              </div>
              <div id="adminNotifList" class="notif-list"><div class="empty-state" style="padding:20px;"><p class="small">Cargando…</p></div></div>
            </div>
          </div>
          <button id="adminLogoutM" class="icon-btn" type="button" aria-label="Cerrar sesión">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </header>

      <div id="offlineBar" class="offline-bar">Sin conexión. Las acciones administrativas requieren internet.</div>

      <main>
        <section id="panel-citas" class="panel">
          <div class="card">
            <div class="section-head">
              <h2 class="section-title">Citas</h2>
              <select id="filterStatus" class="input" style="width:auto;min-height:40px;padding:8px 12px;">
                <option value="">Todas</option>
                <option value="pending">Pendientes</option>
                <option value="approved">Aprobadas</option>
                <option value="cancelled">Canceladas</option>
                <option value="completed">Completadas</option>
              </select>
            </div>
            <div id="adminAppointments"></div>
          </div>
        </section>

        <section id="panel-pacientes" class="panel hidden">
          <div class="card">
            <div class="section-head">
              <h2 class="section-title">Pacientes</h2>
              <button id="newPatientBtn" class="btn btn-brand btn-sm">+ Nuevo</button>
            </div>
            <div class="field"><input id="patientSearch" class="input" placeholder="Buscar por nombre o correo…" /></div>
            <div id="patientList"></div>
          </div>
        </section>

        <section id="panel-servicios" class="panel hidden">
          <div class="card">
            <div class="section-head">
              <h2 class="section-title">Servicios</h2>
              <button id="newServiceBtn" class="btn btn-brand btn-sm">+ Servicio</button>
            </div>
            <div id="serviceGrid" class="grid-2"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <nav class="bottom-nav three admin-mobile-nav" aria-label="Navegación admin">
    <button data-tab="citas" class="nav-item nav-btn active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Citas</span></button>
    <button data-tab="pacientes" class="nav-item nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Pacientes</span></button>
    <button data-tab="servicios" class="nav-item nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/></svg><span>Servicios</span></button>
  </nav>

  <div id="modal" class="backdrop">
    <div class="sheet-modal">
      <div class="sheet-handle"></div>
      <div class="modal-head">
        <h3 id="modalTitle" class="modal-title"></h3>
        <button id="modalCloseX" class="icon-btn" type="button" aria-label="Cerrar" style="width:38px;height:38px;">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-actions">
        <button id="modalCancel" class="btn btn-ghost">Cancelar</button>
        <button id="modalOk" class="btn btn-brand">Guardar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/admin.js?v=20261125a"></script>
</body>
</html>
